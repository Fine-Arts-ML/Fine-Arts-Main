# Deployment-ready docker-compose file for pre-built images
# Use this file after loading exported images on the target server
# Usage: docker compose -f docker-compose.deploy.yml up -d
# This uses a Cloudlfare Tunnel to expose the app
services:
  app:
    image: shop_management-app:latest
    container_name: shop_management-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - NC_ACC=${NC_ACC}
      - NC_PASS=${NC_PASS}
      - NC_HOST=${NC_HOST}
      - RAG_SERVICE_URL=http://rag-search:8079
    depends_on:
      rag-search:
        condition: service_started
    restart: unless-stopped
    networks:
      - shop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  rag-search:
    image: shop_management-rag-search:latest
    container_name: shop_management-rag-search
    ports:
      - "8079:8079"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-qwen3-0.6b}
      - MODELS_DIR=/app/rag_search/Models
      - INDEX_DIR=/app/rag_search/tfidf-index
      - MAX_CACHED_MODELS=1
      - HOST=0.0.0.0
      - PORT=8079
    volumes:
      - ./rag-models:/app/rag_search/Models
      - ./tfidf-index:/app/rag_search/tfidf-index
    restart: unless-stopped
    networks:
      - shop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8079/api/v1/rag/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: shops_cloudflared
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARE_TOKEN}
    networks:
      - shop-network


networks:
  shop-network:
    driver: bridge
