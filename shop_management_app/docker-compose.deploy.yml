# Deployment-ready docker-compose file for pre-built images
# Use this file after loading exported images on the target server
#
# Usage:
#   1. Copy images to server using import-images.sh
#   2. Configure .env file with your settings
#   3. Run: docker compose -f docker-compose.deploy.yml up -d
#
# Optional: Remove the 'tunnel' service block if you don't use Cloudflare
# =============================================================================

services:
  app:
    image: shop-management-app:latest
    container_name: shop-management-app
    # Note: When using Cloudflare Tunnel, port 3000 is only exposed internally.
    # External HTTPS access is provided by the tunnel service below.
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - NC_ACC=${NC_ACC}
      - NC_PASS=${NC_PASS}
      - NC_HOST=${NC_HOST}
      - RAG_SERVICE_URL=http://rag-search:8079
      - HASH_SERVICE_URL=http://hash-calc:8078
      # Session cookie settings for HTTPS (Cloudflare Tunnel)
      - SESSION_COOKIE_SECURE=true
      - SESSION_COOKIE_SAMESITE=lax
    depends_on:
      rag-search:
        condition: service_started
      hash-calc:
        condition: service_started
    restart: unless-stopped
    networks:
      - shop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  rag-search:
    image: shop-management-rag-search:latest
    container_name: shop-management-rag-search
    ports:
      - "8079:8079"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-qwen3-0.6b}
      - MODELS_DIR=/app/rag_search/Models
      - INDEX_DIR=/app/rag_search/tfidf-index
      - MAX_CACHED_MODELS=1
      - HOST=0.0.0.0
      - PORT=8079
    volumes:
      - rag-models:/app/rag_search/Models
      - tfidf-index:/app/rag_search/tfidf-index
    restart: unless-stopped
    networks:
      - shop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8079/api/v1/rag/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  hash-calc:
    image: shop-management-hash-calc:latest
    container_name: shop-management-hash-calc
    ports:
      - "8078:8078"
    environment:
      - HOST=0.0.0.0
      - PORT=8078
    restart: unless-stopped
    networks:
      - shop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8078/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Cloudflare Tunnel for secure HTTPS access
  # Get your token from: https://dash.cloudflare.com/?to=academy/courses/cloudflare-tunnel
  # The tunnel creates an encrypted connection from your server to Cloudflare's network
  # All traffic from users goes through HTTPS -> Cloudflare -> Tunnel -> Your App
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: shop-management-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN}
    depends_on:
      - app
    networks:
      - shop-network

volumes:
  rag-models:
    driver: local
  tfidf-index:
    driver: local

networks:
  shop-network:
    driver: bridge
